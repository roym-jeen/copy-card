<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>העתקת כרטיס למייל</title>
</head>
<body style="margin: 0; padding: 24px 16px; background-color: #f5f5f5; font-family: Arial, Helvetica, sans-serif; color: #101820;">
<div style="max-width: 720px; margin: 0 auto;">
<h1 style="font-size: 22px; margin: 0 0 6px;">העתקת כרטיס למייל</h1>
<p style="margin: 0 0 16px; color: #555;">1. לחץ Copy על "קוד HTML של הכרטיס".&nbsp; 2. לחץ "הדבק מהלוח".&nbsp; 3. לחץ "העתק כרטיס למייל" והדבק בגוף המייל.</p>
<div style="margin: 0 0 12px;"><button id="paste" style="font-size: 16px; font-weight: 700; color: #4c37e5; background-color: #f2f2ff; border: 1px solid #4c37e5; border-radius: 30px; padding: 12px 28px; cursor: pointer;">הדבק מהלוח</button></div>
<textarea id="src" placeholder="הדבק כאן את קוד ה-HTML..." style="width: 100%; box-sizing: border-box; height: 140px; padding: 12px; font-family: monospace; font-size: 13px; direction: ltr; text-align: left; border: 1px solid #ccc; border-radius: 10px;"></textarea>
<div style="display: flex; gap: 10px; align-items: center; margin: 12px 0 20px; flex-wrap: wrap;">
<button id="copy" style="font-size: 16px; font-weight: 700; color: #fff; background-color: #4c37e5; border: none; border-radius: 30px; padding: 12px 28px; cursor: pointer;">העתק כרטיס למייל</button>
<button id="clear" style="font-size: 14px; color: #4c37e5; background: none; border: 1px solid #4c37e5; border-radius: 30px; padding: 10px 20px; cursor: pointer;">נקה</button>
<span id="status" style="font-weight: 700;"></span>
</div>
<div style="font-size: 13px; color: #888; margin-bottom: 6px;">תצוגה מקדימה:</div>
<div id="preview" style="background: #fff; border-radius: 12px; padding: 8px; min-height: 60px;"></div>
</div>
<script>
var src = document.getElementById('src');
var preview = document.getElementById('preview');
var status = document.getElementById('status');

function cardHtml() {
  var raw = src.value;
  // Remove the copy-button snippet and any script if pasted along with the card
  raw = raw.replace(/<script[\s\S]*?<\/script>/gi, '');
  raw = raw.replace(/<div[^>]*>\s*<button[\s\S]*?<\/button>\s*<\/div>/gi, '');
  raw = raw.replace(/^\s*```(html)?\s*/i, '').replace(/\s*```\s*$/, '');
  return raw.trim();
}

function render() {
  preview.innerHTML = cardHtml();
  status.textContent = '';
}

src.addEventListener('input', render);

document.getElementById('paste').onclick = function () {
  if (!navigator.clipboard || !navigator.clipboard.readText) {
    status.style.color = '#c0392b'; status.textContent = 'הדפדפן לא מאפשר - הדבק ידנית בתיבה (Cmd+V)'; src.focus(); return;
  }
  navigator.clipboard.readText().then(function (t) {
    src.value = t; render();
    if (!cardHtml()) { status.style.color = '#c0392b'; status.textContent = 'הלוח ריק - קודם לחץ Copy על קוד ה-HTML'; }
  }, function () {
    status.style.color = '#c0392b'; status.textContent = 'אין הרשאה ללוח - הדבק ידנית בתיבה (Cmd+V)'; src.focus();
  });
};

document.getElementById('clear').onclick = function () {
  src.value = '';
  render();
  src.focus();
};

document.getElementById('copy').onclick = function () {
  var html = cardHtml();
  if (!html) { status.style.color = '#c0392b'; status.textContent = 'קודם הדבק את קוד ה-HTML'; return; }
  var text = preview.innerText;
  var done = function () { status.style.color = '#1e8e3e'; status.textContent = 'הועתק - אפשר להדביק במייל'; };
  var fail = function () { status.style.color = '#c0392b'; status.textContent = 'ההעתקה נכשלה'; };
  var handler = function (e) {
    e.clipboardData.setData('text/html', html);
    e.clipboardData.setData('text/plain', text);
    e.preventDefault();
  };
  document.addEventListener('copy', handler);
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
  document.removeEventListener('copy', handler);
  if (ok) { done(); return; }
  if (navigator.clipboard && window.ClipboardItem) {
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([text], { type: 'text/plain' })
    })]).then(done, fail);
  } else { fail(); }
};
</script>
</body>
</html>
